# PURL configuration for http://purl.obolibrary.org/obo/steel

idspace: STEEL
base_url: /obo/steel

products:
- steel.owl: https://raw.githubusercontent.com/materialdigital/steel-classification-ontology/main/steel.owl
- steel.obo: https://raw.githubusercontent.com/materialdigital/steel-classification-ontology/main/steel.obo

term_browser: ontobee
example_terms:
- STEEL_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/materialdigital/steel-classification-ontology/v

- prefix: /tracker/
  replacement: https://github.com/materialdigital/steel-classification-ontology/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/STEEL?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/materialdigital/steel-classification-ontology/main/
