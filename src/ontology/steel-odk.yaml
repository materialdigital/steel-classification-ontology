id: steel
title: "Steel Classification Ontology"
github_org: materialdigital
git_main_branch: main
repo: steel-classification-ontology
uribase: https://w3id.org/pmd
uribase_suffix: steel
preferredPrefix: STEEL
edit_format: owl

# DISABLE Templates for now
use_templates: false

# Imports 
import_group:
  annotate_with_labels: true
  annotation_properties: ['rdfs:label', 'skos:definition', 'skos:example', 'skos:comment', 'skos:altLabel' ]
  
  products:
    - id: pmdco
      title: "PMD Core Ontology"
      mirror_from: https://raw.githubusercontent.com/materialdigital/core-ontology/refs/heads/main/src/ontology/pmdco.ttl
    - id: tto
      mirror_from: https://raw.githubusercontent.com/materialdigital/tensile-test-ontology/refs/heads/main/src/ontology/tto.owl 
      module_type: custom
    - id: uo
      mirror_from: https://raw.githubusercontent.com/bio-ontology-research-group/unit-ontology/refs/heads/master/uo-full.owl
      module_type: custom
    - id: qudt
      mirror_from: https://qudt.org/qudt-all
      module_type: custom
    - id: iao
      title: "Information Artifact Ontology"
      mirror_from: https://raw.githubusercontent.com/information-artifact-ontology/IAO/refs/heads/master/iao.owl
      module_type: custom
    - id: vto
      mirror_from: https://raw.githubusercontent.com/materialdigital/vickers-testing-ontology/refs/heads/main/vto-base.owl 
      module_type: custom
    - id: hto
      mirror_from: https://raw.githubusercontent.com/materialdigital/heat-treatment-application-ontology/refs/heads/main/hto.owl 
      module_type: custom
    - id: mech
      mirror_from: https://raw.githubusercontent.com/materialdigital/mechanical-testing-ontology/refs/heads/main/mech.owl 
      module_type: custom
# Components
components:
  products:
    - filename: imports-edit.owl
    - filename: steel-axioms-shared.owl
    - filename: steel-list.owl

# Release
primary_release: full
release_artefacts:
  - base
  - full
export_formats:
  - owl
  - ttl

ci:
  - github_actions

namespaces:
  - https://w3id.org/pmd/steel/

idranges:
  - idsfor: steel
    idprefix: https://w3id.org/pmd/steel/STEEL_
    iddigits: 7
